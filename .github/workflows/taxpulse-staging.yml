name: TaxPulse staging checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Upload generated statutory evidence registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statutory-evidence-registry
          path: rules/statutory-evidence-registry.json
          if-no-files-found: warn
          retention-days: 30
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Audit installed test dependencies
        run: npm audit --audit-level=high --package-lock-only
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test the actual simple workspace in Chromium
        run: node browser-tests/smoke.mjs
      - name: Reproduce staging build and record exact module hashes
        run: |
          node staging/integrated/build.mjs
          node scripts/preview-build-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build-evidence
          path: |
            preview-build-evidence.json
            local-accessibility-performance.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: preview-deployment-package
          path: |
            staging/integrated/bundle/
            preview-build-evidence.json
          retention-days: 7
  regulatory-source-probe:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official sources without changing rules
        run: node scripts/probe-regulatory-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regulatory-source-probe
          path: regulatory-probe.json
          if-no-files-found: warn
          retention-days: 7
