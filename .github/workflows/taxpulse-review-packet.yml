name: TaxPulse independent review handoff
on:
  pull_request:
    paths:
      - 'scripts/prepare-review-packet.mjs'
      - 'scripts/production-readiness-report.mjs'
      - 'tests/production-readiness-report.test.mjs'
      - '.github/workflows/taxpulse-review-packet.yml'
      - 'REVIEW-HANDOFF.md'
      - 'rules/**'
      - 'engine/release-gate.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-review-packet.mjs'
      - 'scripts/production-readiness-report.mjs'
      - 'tests/production-readiness-report.test.mjs'
      - '.github/workflows/taxpulse-review-packet.yml'
      - 'REVIEW-HANDOFF.md'
      - 'rules/**'
      - 'engine/release-gate.mjs'
      - 'data/d1-migration-005-preview-2026-11-27.json'
      - 'data/preview-boundary-observation.json'
      - 'data/regulatory-source-observation-2026-11-27.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/review-packet.test.mjs tests/production-readiness-report.test.mjs
      - run: node scripts/prepare-review-packet.mjs independent-review-packet.json
      - run: node scripts/production-readiness-report.mjs > production-readiness-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: independent-review-packet
          path: |
            independent-review-packet.json
            production-readiness-report.json
          retention-days: 30
