name: TaxPulse daily regulatory evidence (review only)
on:
  # Daily schedule will be enabled after the new repository's collector key is enrolled and verified.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/taxpulse-regulatory-daily.yml']
permissions:
  contents: read
concurrency:
  group: taxpulse-daily-evidence
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      evidence_artifact: ${{ steps.digest.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect official regulatory observations
        run: node scripts/probe-regulatory-sources.mjs
      - name: Bind report digest to immutable workflow artifact
        id: digest
        run: |
          digest=$(sha256sum regulatory-probe.json | cut -d ' ' -f 1)
          printf 'name=taxpulse-evidence-sha256-%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.digest.outputs.name }}
          path: regulatory-probe.json
          if-no-files-found: error
          retention-days: 7
  submit:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.collect.outputs.evidence_artifact }}
          path: .
      - name: Submit signed evidence only to the isolated preview intake
        env:
          TAXPULSE_EVIDENCE_PRIVATE_KEY: ${{ secrets.TAXPULSE_EVIDENCE_PRIVATE_KEY }}
        run: |
          if [ -z "$TAXPULSE_EVIDENCE_PRIVATE_KEY" ]; then
            echo '::error::Collector key enrollment required. Collection artifact remains available.'
            exit 1
          fi
          node scripts/submit-regulatory-signed.mjs regulatory-probe.json
