name: TaxPulse hosted preview verification
on:
  push:
    branches: [main]
    paths:
      - 'data/hosted-preview-check.json'
permissions:
  contents: read
jobs:
  hosted-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high --package-lock-only
          npx --no-install playwright install --with-deps chromium
      - name: Check exact hosted revision
        run: node browser-tests/hosted-smoke.mjs
